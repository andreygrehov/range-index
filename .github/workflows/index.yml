name: index

# Builds the index of every layer of the images in images.txt that the
# catalog does not hold yet, and publishes each one as a release asset.
# Tags move as images are rebuilt, so it runs every day and indexes only the
# new layers.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: andreygrehov/range
          path: range-src

      - uses: actions/setup-go@v5
        with:
          go-version-file: range-src/go.mod

      - name: Build range
        run: cd range-src && CGO_ENABLED=0 go build -o ../range ./cmd/range

      - name: Index new layers
        run: ./range index $(grep -v '^#' images.txt | grep .) -o out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./publish.sh out
