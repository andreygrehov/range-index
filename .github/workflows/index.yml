name: index

# Builds the index of every layer of the images in images.txt that the
# catalog does not hold yet, then runs each image once on amd64 and arm64 to
# record a startup profile, and publishes both as release assets. Tags move as
# images are rebuilt, so it runs every day. Docker Hub images are read through
# mirror.gcr.io, which serves the same digests without Docker Hub's rate limit.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: andreygrehov/range
          path: range-src

      - uses: actions/setup-go@v5
        with:
          go-version-file: range-src/go.mod

      - name: Build range
        run: cd range-src && CGO_ENABLED=0 go build -o ../range ./cmd/range

      - name: Index new layers
        env:
          RANGE_REGISTRY_MIRROR: mirror.gcr.io
        # An image without a build for one platform is not a reason to skip
        # publishing everything else.
        run: ./range index $(sed 's/#.*//; s/|.*//' images.txt | xargs) -o out || echo "::warning::some images were not indexed"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./publish.sh out

  profile:
    needs: index
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: andreygrehov/range
          path: range-src

      - uses: actions/setup-go@v5
        with:
          go-version-file: range-src/go.mod

      - name: Build range
        run: cd range-src && CGO_ENABLED=0 go build -o ../range ./cmd/range

      - name: Kernel modules
        run: sudo modprobe nbd nbds_max=16 && sudo modprobe erofs && sudo modprobe overlay && sudo ./range doctor

      - name: Record startup profiles
        env:
          RANGE_REGISTRY_MIRROR: mirror.gcr.io
        run: ./profile.sh out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./publish.sh out

